<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>面试宝典</title>
    <script>
      // GitHub Pages SPA 回退：GH 会用本文件响应所有未命中的路径（URL 保持原样）。
      // 处理：把真实路径存入 sessionStorage → 跳到应用根 → index.html 的配套脚本恢复路由。
      // 注意：BASE 需与 vite.config.ts 的 base 保持一致（切换部署形态时两处同步修改）。
      ;(function () {
        var BASE = '/interview.xwzy.dev/'
        sessionStorage.setItem('redirect', location.pathname + location.search + location.hash)
        window.location.replace(BASE)
      })()
    </script>
  </head>
  <body></body>
</html>
